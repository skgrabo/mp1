<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MP1</title>
        <script src="https://kit.fontawesome.com/c444ee099a.js" crossorigin="anonymous"></script>
        <script src="./js/main.js" defer></script>
    </head>
    <body>
        <nav class="navbar" id="navbar">
            <ul class="nav-links">
                <li><a href="#header">Section 1</a></li>
                <li><a href="#main-content">Section 2</a></li>
                <li><a href="#slideshow-container">Section 3</a></li>
                <li><a href="#footer">Section 4</a></li>
            </ul>
        </nav>

        <header class="header" id="header">
            <h1>Section 1</h1>
            <video autoplay muted loop playsinline width="80%" height="auto">
                <source src="./assets/stars.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </header>

        <div id="main-content" class="main-content">
            <h1>Section 2</h1>
        </div>

        <div class="container-container">
            <div class="slideshow-container" id="slideshow-container">
                <h1>Section 3</h1>

                    <div class="mySlides fade">
                        <div class="numbertext">1 / 4</div>
                        <img src="./assets/flowers.jpg" style="width:100%">
                    </div>

                    <div class="mySlides fade">
                        <div class="numbertext">2 / 4</div>
                        <img src="./assets/shimmer.jpg" style="width:100%">
                    </div>

                    <div class="mySlides fade">
                        <div class="numbertext">3 / 4</div>
                        <img src="./assets/houses.jpg" style="width:100%">
                    </div>

                    <div class="mySlides fade">
                        <div class="numbertext">4 / 4</div>
                        <img src="./assets/tiles.jpg" style="width:100%">
                    </div>

                    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
                    <a class="next" onclick="plusSlides(1)">&#10095;</a>
            </div>
        </div>

        <footer class="footer" id="footer">
            <div class="grid-item"><h1><i class="fa-solid fa-face-smile"></i></h1></div>
            <div class="grid-item">
                <button id="openModalBtn">Open Modal</button>
                <dialog id="myModal">
                    <h2>Hi</h2>
                    <p>Welcome to my purple website!</p>
                    <button id="closeModalBtn">Close</button>
                </dialog>
            </div>
            <div class="grid-item"><h1><i class="fa-brands fa-linkedin"></i><i class="fa-brands fa-github"></i></h1></div>
        </footer>
    </body>
</html>
